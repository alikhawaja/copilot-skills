name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skill manifests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifests = Get-ChildItem skills -Filter SKILL.md -File -Recurse
          if (-not $manifests) {
            throw 'No skill manifests found.'
          }

          foreach ($manifest in $manifests) {
            $skill = Split-Path $manifest.DirectoryName -Leaf
            $content = Get-Content $manifest.FullName -Raw
            $pattern = "(?s)^---\r?\nname:\s+$([regex]::Escape($skill))\r?\n.*?\r?\n---\r?\n"
            if ($content -notmatch $pattern) {
              throw "Invalid frontmatter: $($manifest.FullName)"
            }
            if ($content -match '(gh[opsu]_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16})') {
              throw "Possible credential detected: $($manifest.FullName)"
            }
          }

  test-powershell-installer:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install skill
        shell: pwsh
        env:
          COPILOT_SKILLS_HOME: ${{ runner.temp }}/copilot-skills
        run: |
          ./install.ps1 -Skill dev-machine-setup
          $manifest = Join-Path $env:COPILOT_SKILLS_HOME 'dev-machine-setup/SKILL.md'
          if (-not (Test-Path -LiteralPath $manifest)) {
            throw 'Installed manifest not found.'
          }
      - name: Reinstall skill atomically
        shell: pwsh
        env:
          COPILOT_SKILLS_HOME: ${{ runner.temp }}/copilot-skills
        run: ./install.ps1 -Skill dev-machine-setup

  test-shell-installer:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install and update skill
        shell: bash
        env:
          COPILOT_SKILLS_HOME: ${{ runner.temp }}/copilot-skills
        run: |
          ./install.sh dev-machine-setup
          ./install.sh dev-machine-setup
          test -f "$COPILOT_SKILLS_HOME/dev-machine-setup/SKILL.md"
